<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="bgGlowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="seoCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231A38"/>
      <stop offset="100%" stop-color="#0B0916"/>
    </linearGradient>
    <linearGradient id="seoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadowSeo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <circle cx="160" cy="130" r="60" stroke="url(#bgGlowPurple)" stroke-width="2" fill="none" opacity="0.75"/>
  <circle cx="160" cy="130" r="45" stroke="#C084FC" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>

  <g filter="url(#shadowSeo)">
    <rect x="70" y="38" width="115" height="104" rx="12" fill="url(#seoCardGrad)" stroke="url(#seoBorder)" stroke-width="1.5"/>
    
    <!-- Search Bar Mockup -->
    <rect x="82" y="50" width="90" height="14" rx="7" fill="#140E24" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1"/>
    <circle cx="90" cy="57" r="3.5" stroke="#C084FC" stroke-width="1.2" fill="none"/>
    <rect x="98" y="55" width="40" height="4" rx="2" fill="#94A3B8" opacity="0.5"/>

    <!-- Ranking #1 Badge -->
    <rect x="82" y="74" width="90" height="24" rx="6" fill="#2E1B4E" stroke="#C084FC" stroke-width="0.8"/>
    <circle cx="94" cy="86" r="6" fill="#A855F7"/>
    <text x="92" y="90" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">1</text>
    <rect x="106" y="81" width="34" height="4" rx="2" fill="#E879F9"/>
    <rect x="106" y="88" width="50" height="3" rx="1.5" fill="#64748B"/>

    <!-- Ranking #2 Bar -->
    <rect x="82" y="104" width="90" height="16" rx="4" fill="#181128"/>
    <rect x="94" y="110" width="40" height="4" rx="2" fill="#64748B" opacity="0.6"/>
  </g>

  <!-- Floating Social Share Badge -->
  <g filter="url(#shadowSeo)">
    <rect x="22" y="74" width="46" height="42" rx="10" fill="#0A0713" stroke="#C084FC" stroke-width="1.6"/>
    <!-- Share / Connection Nodes -->
    <circle cx="36" cy="94" r="3.5" fill="#C084FC"/>
    <circle cx="50" cy="86" r="3.5" fill="#E879F9"/>
    <circle cx="50" cy="102" r="3.5" fill="#A855F7"/>
    <line x1="36" y1="94" x2="50" y2="86" stroke="#C084FC" stroke-width="1.5"/>
    <line x1="36" y1="94" x2="50" y2="102" stroke="#C084FC" stroke-width="1.5"/>
    <circle cx="63" cy="74" r="3" fill="#C084FC"/>
  </g>
</svg>
