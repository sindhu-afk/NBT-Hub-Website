<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="bgGlowBill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E59C3A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E59C3A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="billCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243345"/>
      <stop offset="100%" stop-color="#0E1A29"/>
    </linearGradient>
    <linearGradient id="billBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E59C3A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D48D30" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadowBill" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <circle cx="160" cy="130" r="60" stroke="url(#bgGlowBill)" stroke-width="2" fill="none" opacity="0.75"/>
  <circle cx="160" cy="130" r="45" stroke="#E59C3A" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>

  <g filter="url(#shadowBill)">
    <rect x="70" y="38" width="115" height="104" rx="12" fill="url(#billCardGrad)" stroke="url(#billBorder)" stroke-width="1.5"/>
    
    <!-- Printable Invoice Receipt Mockup -->
    <rect x="85" y="48" width="85" height="82" rx="4" fill="#15263A" stroke="rgba(229, 156, 58, 0.3)" stroke-width="1"/>
    
    <!-- Header of Invoice -->
    <rect x="94" y="56" width="35" height="5" rx="2.5" fill="#E59C3A"/>
    <circle cx="158" cy="58" r="4" fill="#10B981"/>

    <!-- Invoice Ledger Items -->
    <rect x="94" y="68" width="67" height="3" rx="1.5" fill="#64748B" opacity="0.6"/>
    <rect x="94" y="75" width="45" height="3" rx="1.5" fill="#64748B" opacity="0.4"/>
    <rect x="94" y="82" width="67" height="3" rx="1.5" fill="#64748B" opacity="0.6"/>
    <rect x="94" y="89" width="55" height="3" rx="1.5" fill="#64748B" opacity="0.4"/>

    <!-- Total Amount Block -->
    <rect x="94" y="98" width="67" height="18" rx="3" fill="#1C314B" stroke="rgba(229, 156, 58, 0.4)" stroke-width="0.8"/>
    <text x="100" y="111" font-family="monospace" font-size="9" font-weight="bold" fill="#F5B056">₹ 48,250</text>
    <circle cx="152" cy="107" r="3" fill="#10B981"/>
  </g>

  <!-- Floating Shield / GST Badge -->
  <g filter="url(#shadowBill)">
    <rect x="22" y="74" width="46" height="42" rx="10" fill="#0E1724" stroke="#E59C3A" stroke-width="1.6"/>
    <!-- Receipt / Shield Icon -->
    <path d="M45 84 L53 87 L53 96 C53 100 45 104 45 104 C45 104 37 100 37 96 L37 87 Z" fill="#E59C3A" fill-opacity="0.3" stroke="#F5B056" stroke-width="1.5"/>
    <path d="M42 94 L44 96 L48 91" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="63" cy="74" r="3" fill="#E59C3A"/>
  </g>
</svg>
