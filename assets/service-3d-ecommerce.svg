<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="bgGlowGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E59C3A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E59C3A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ecomCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2B40"/>
      <stop offset="100%" stop-color="#0A1624"/>
    </linearGradient>
    <linearGradient id="ecomBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E59C3A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D48D30" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="productPedestal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D425E"/>
      <stop offset="100%" stop-color="#142132"/>
    </linearGradient>
    <linearGradient id="sneakerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="shadowEcom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Ambient Golden Background Arc -->
  <circle cx="160" cy="130" r="60" stroke="url(#bgGlowGold)" stroke-width="2" fill="none" opacity="0.75"/>
  <circle cx="160" cy="130" r="45" stroke="#E59C3A" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>

  <!-- Product Card Frame in Isometric -->
  <g filter="url(#shadowEcom)">
    <!-- Base Product Card -->
    <rect x="75" y="44" width="110" height="100" rx="12" fill="url(#ecomCardGrad)" stroke="url(#ecomBorder)" stroke-width="1.5"/>
    
    <!-- Top Price Badge / Pill -->
    <rect x="88" y="56" width="36" height="12" rx="6" fill="#D48D30" fill-opacity="0.25" stroke="#E59C3A" stroke-width="0.8"/>
    <rect x="94" y="60" width="24" height="4" rx="2" fill="#F5B056"/>

    <!-- Product Display Area / Pedestal -->
    <ellipse cx="130" cy="106" rx="42" ry="14" fill="url(#productPedestal)" stroke="rgba(212, 141, 48, 0.4)" stroke-width="1"/>
    
    <!-- Stylized 3D Sneaker on Pedestal -->
    <!-- Sole -->
    <path d="M102 104 C108 107, 126 109, 146 106 C156 104, 162 101, 160 98 C158 96, 148 98, 138 98 C124 98, 110 96, 102 104 Z" fill="#FFFFFF"/>
    <!-- Shoe Upper -->
    <path d="M104 102 C108 97, 114 90, 122 84 C128 80, 136 78, 142 82 C146 86, 144 92, 150 94 C156 95, 159 97, 158 99 C154 100, 144 100, 136 100 C122 100, 110 99, 104 102 Z" fill="url(#sneakerGrad)"/>
    <!-- Gold Swoosh Accent on Shoe -->
    <path d="M120 94 Q134 88 144 92" stroke="#E59C3A" stroke-width="2" stroke-linecap="round"/>

    <!-- Product Rating Stars & Info Lines -->
    <rect x="88" y="124" width="45" height="5" rx="2.5" fill="#E59C3A" opacity="0.8"/>
    <rect x="88" y="133" width="65" height="4" rx="2" fill="#64748B" opacity="0.5"/>
  </g>

  <!-- Floating Glass Shopping Cart Badge (Right Side) -->
  <g filter="url(#shadowEcom)">
    <rect x="135" y="68" width="48" height="42" rx="10" fill="#0A1624" stroke="#E59C3A" stroke-width="1.8"/>
    <!-- Shopping Cart Icon -->
    <path d="M147 79 L150 79 L154 90 L168 90 L171 83 L152 83" stroke="#F5B056" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="156" cy="94" r="2" fill="#F5B056"/>
    <circle cx="166" cy="94" r="2" fill="#F5B056"/>
    <!-- Glowing Pip -->
    <circle cx="177" cy="70" r="3" fill="#E59C3A"/>
    <circle cx="177" cy="70" r="6" fill="#E59C3A" opacity="0.35"/>
  </g>
</svg>
