<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="bgGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E59C3A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E59C3A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2D44"/>
      <stop offset="100%" stop-color="#0A1624"/>
    </linearGradient>
    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D48D30" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#64748B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E59C3A" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243B55"/>
      <stop offset="100%" stop-color="#141E30"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Ambient Golden Background Arc -->
  <circle cx="160" cy="130" r="60" stroke="url(#bgGlow1)" stroke-width="2" fill="none" opacity="0.75"/>
  <circle cx="160" cy="130" r="45" stroke="#E59C3A" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>

  <!-- Main 3D Browser Window Frame -->
  <g filter="url(#shadow1)">
    <rect x="50" y="32" width="135" height="108" rx="10" fill="url(#windowGrad)" stroke="url(#windowBorder)" stroke-width="1.5"/>
    
    <!-- Window Titlebar -->
    <path d="M50 42 C50 36.5 54.5 32 60 32 L175 32 C180.5 32 185 36.5 185 42 L185 48 L50 48 Z" fill="#0C1B2C" fill-opacity="0.9"/>
    
    <!-- Window Dots -->
    <circle cx="62" cy="40" r="2.5" fill="#EF4444" opacity="0.85"/>
    <circle cx="70" cy="40" r="2.5" fill="#F59E0B" opacity="0.85"/>
    <circle cx="78" cy="40" r="2.5" fill="#10B981" opacity="0.85"/>
    <rect x="90" y="37" width="55" height="6" rx="3" fill="#334155" opacity="0.6"/>

    <!-- Hero Image Thumbnail in Browser -->
    <rect x="60" y="56" width="70" height="42" rx="6" fill="url(#heroCardGrad)" stroke="rgba(212, 141, 48, 0.3)" stroke-width="1"/>
    
    <!-- Mountain/Image Silhouette in Preview -->
    <path d="M68 88 L85 70 L98 84 L110 74 L122 88 Z" fill="#E59C3A" fill-opacity="0.35"/>
    <circle cx="82" cy="68" r="4" fill="#F5B056" fill-opacity="0.7"/>

    <!-- Code & Content Placeholder Bars -->
    <rect x="138" y="58" width="38" height="5" rx="2.5" fill="#E59C3A" opacity="0.75"/>
    <rect x="138" y="68" width="30" height="4" rx="2" fill="#94A3B8" opacity="0.45"/>
    <rect x="138" y="76" width="34" height="4" rx="2" fill="#94A3B8" opacity="0.3"/>
    <rect x="138" y="84" width="24" height="4" rx="2" fill="#94A3B8" opacity="0.3"/>

    <!-- Lower Content Blocks -->
    <rect x="60" y="106" width="54" height="22" rx="4" fill="#15263A" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <rect x="120" y="106" width="56" height="22" rx="4" fill="#15263A" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  </g>

  <!-- Foreground Floating Code Badge -->
  <g filter="url(#shadow1)">
    <rect x="18" y="76" width="48" height="42" rx="8" fill="#0A1624" stroke="#E59C3A" stroke-width="1.8"/>
    <!-- Glowing </ > symbol -->
    <path d="M32 91 L26 97 L32 103" stroke="#F5B056" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 91 L48 97 L42 103" stroke="#F5B056" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 89 L34 105" stroke="#00C6FF" stroke-width="2" stroke-linecap="round"/>
    <!-- Glowing Badge Pip -->
    <circle cx="58" cy="76" r="3" fill="#E59C3A"/>
    <circle cx="58" cy="76" r="6" fill="#E59C3A" opacity="0.35"/>
  </g>
</svg>
