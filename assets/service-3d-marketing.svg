<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="bgGlowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00C6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mktCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162A45"/>
      <stop offset="100%" stop-color="#091424"/>
    </linearGradient>
    <linearGradient id="mktBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadowMkt" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <circle cx="160" cy="130" r="60" stroke="url(#bgGlowCyan)" stroke-width="2" fill="none" opacity="0.75"/>
  <circle cx="160" cy="130" r="45" stroke="#00C6FF" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>

  <g filter="url(#shadowMkt)">
    <rect x="65" y="38" width="120" height="104" rx="12" fill="url(#mktCardGrad)" stroke="url(#mktBorder)" stroke-width="1.5"/>
    
    <!-- Titlebar & Metric -->
    <rect x="78" y="50" width="40" height="6" rx="3" fill="#38BDF8"/>
    <rect x="146" y="48" width="28" height="10" rx="5" fill="rgba(0,198,255,0.2)" stroke="#00C6FF" stroke-width="0.8"/>
    
    <!-- Rising 3D Bar Graph -->
    <rect x="78" y="105" width="12" height="25" rx="3" fill="#0369A1"/>
    <rect x="96" y="90" width="12" height="40" rx="3" fill="#0284C7"/>
    <rect x="114" y="75" width="12" height="55" rx="3" fill="#0EA5E9"/>
    <rect x="132" y="65" width="12" height="65" rx="3" fill="#00C6FF" stroke="#FFFFFF" stroke-width="0.8"/>

    <!-- Upward Trend Line -->
    <path d="M84 100 L102 85 L120 70 L138 60 L158 52" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="158" cy="52" r="3.5" fill="#FFFFFF" stroke="#00C6FF" stroke-width="2"/>
  </g>

  <!-- Floating Rocket Badge -->
  <g filter="url(#shadowMkt)">
    <rect x="24" y="74" width="46" height="42" rx="10" fill="#0A1624" stroke="#00C6FF" stroke-width="1.6"/>
    <!-- Rocket Icon -->
    <path d="M47 84 C41 90, 40 98, 40 98 C40 98, 48 97, 54 91 C58 87, 59 81, 59 81 C59 81, 53 80, 47 84 Z" fill="#38BDF8"/>
    <circle cx="48" cy="88" r="2.5" fill="#0c1b2c"/>
    <circle cx="65" cy="74" r="3" fill="#00C6FF"/>
  </g>
</svg>
