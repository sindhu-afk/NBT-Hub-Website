<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="bgGlowEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00C6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aiCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122A38"/>
      <stop offset="100%" stop-color="#06131D"/>
    </linearGradient>
    <linearGradient id="aiBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00C6FF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3D3E"/>
      <stop offset="100%" stop-color="#051C1E"/>
    </linearGradient>
    <filter id="shadowAi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <circle cx="160" cy="130" r="60" stroke="url(#bgGlowEmerald)" stroke-width="2" fill="none" opacity="0.75"/>
  <circle cx="160" cy="130" r="45" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>

  <g filter="url(#shadowAi)">
    <rect x="70" y="38" width="115" height="104" rx="12" fill="url(#aiCardGrad)" stroke="url(#aiBorder)" stroke-width="1.5"/>
    
    <!-- AI Neural Chip Center -->
    <rect x="100" y="60" width="55" height="55" rx="8" fill="url(#chipGrad)" stroke="#10B981" stroke-width="1.4"/>
    
    <!-- Chip Cores / Circuit Pattern -->
    <circle cx="127" cy="87" r="10" fill="#00C6FF" fill-opacity="0.2" stroke="#00C6FF" stroke-width="1.2"/>
    <circle cx="127" cy="87" r="4" fill="#10B981"/>

    <!-- Synaptic Circuit Pins -->
    <line x1="100" y1="72" x2="88" y2="72" stroke="#10B981" stroke-width="1.5"/>
    <line x1="100" y1="87" x2="84" y2="87" stroke="#00C6FF" stroke-width="1.5"/>
    <line x1="100" y1="102" x2="88" y2="102" stroke="#10B981" stroke-width="1.5"/>

    <line x1="155" y1="72" x2="167" y2="72" stroke="#10B981" stroke-width="1.5"/>
    <line x1="155" y1="87" x2="171" y2="87" stroke="#00C6FF" stroke-width="1.5"/>
    <line x1="155" y1="102" x2="167" y2="102" stroke="#10B981" stroke-width="1.5"/>

    <!-- Neural Nodes -->
    <circle cx="84" cy="87" r="2.5" fill="#00C6FF"/>
    <circle cx="171" cy="87" r="2.5" fill="#00C6FF"/>
  </g>

  <!-- Floating Sparkles Badge -->
  <g filter="url(#shadowAi)">
    <rect x="22" y="74" width="46" height="42" rx="10" fill="#061418" stroke="#10B981" stroke-width="1.6"/>
    <!-- Sparkle Symbol -->
    <path d="M45 84 L47 91 L54 93 L47 95 L45 102 L43 95 L36 93 L43 91 Z" fill="#10B981"/>
    <circle cx="53" cy="85" r="2" fill="#00C6FF"/>
    <circle cx="63" cy="74" r="3" fill="#10B981"/>
  </g>
</svg>
