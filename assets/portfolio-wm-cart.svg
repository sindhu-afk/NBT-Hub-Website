<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="cartGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E5A84B" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <!-- Shopping Cart Basket Wireframe -->
  <g stroke="#38BDF8" stroke-width="1.3" stroke-opacity="0.25" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Basket Outline -->
    <path d="M110,65 L185,65 L175,120 L125,120 Z"/>
    <!-- Handle -->
    <path d="M98,50 L110,65"/>
    <path d="M94,50 L102,50"/>
    <!-- Wire Grid Lines Horizontal -->
    <path d="M115,80 L180,80"/>
    <path d="M120,95 L178,95"/>
    <path d="M123,110 L176,110"/>
    <!-- Wire Grid Lines Vertical -->
    <path d="M130,65 L130,120"/>
    <path d="M145,65 L145,120"/>
    <path d="M160,65 L160,120"/>
    <path d="M175,65 L172,120"/>
    <!-- Wheels Base Chassis -->
    <path d="M125,120 L130,135 L170,135 L175,120"/>
  </g>
  <!-- Wheels -->
  <g stroke="#E5A84B" stroke-width="1.4" stroke-opacity="0.35" fill="none">
    <circle cx="135" cy="142" r="6"/>
    <circle cx="165" cy="142" r="6"/>
  </g>
  <g fill="#E5A84B" fill-opacity="0.35">
    <circle cx="135" cy="142" r="2.5"/>
    <circle cx="165" cy="142" r="2.5"/>
  </g>
</svg>
