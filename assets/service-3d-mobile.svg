<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="bgGlowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00C6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="phoneBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1321"/>
    </linearGradient>
    <linearGradient id="phoneBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="glassBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0C1B2C" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadowMobile" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Ambient Cyan Background Arc -->
  <circle cx="160" cy="130" r="60" stroke="url(#bgGlowBlue)" stroke-width="2" fill="none" opacity="0.75"/>
  <circle cx="160" cy="130" r="45" stroke="#00C6FF" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>

  <!-- Main 3D Tilted Smartphone -->
  <g filter="url(#shadowMobile)" transform="rotate(-6 140 85)">
    <!-- Phone Bezel & Body -->
    <rect x="110" y="24" width="70" height="126" rx="16" fill="url(#phoneBodyGrad)" stroke="url(#phoneBorderGrad)" stroke-width="1.8"/>
    <!-- Screen -->
    <rect x="114" y="28" width="62" height="118" rx="13" fill="url(#screenGrad)"/>
    
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="134" y="32" width="22" height="5" rx="2.5" fill="#000"/>
    
    <!-- App UI Mockup Elements -->
    <!-- Top Profile / Header -->
    <circle cx="126" cy="46" r="4.5" fill="#38BDF8" opacity="0.8"/>
    <rect x="136" y="44" width="28" height="4" rx="2" fill="#64748B"/>
    
    <!-- Main UI Card -->
    <rect x="119" y="56" width="52" height="28" rx="6" fill="#1E293B" stroke="rgba(56, 189, 248, 0.25)" stroke-width="0.8"/>
    <path d="M124 74 C130 66, 136 78, 144 68 C152 58, 158 72, 164 64" stroke="#00C6FF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    
    <!-- Sub Card 1 -->
    <rect x="119" y="90" width="52" height="14" rx="4" fill="#15263A"/>
    <circle cx="126" cy="97" r="3" fill="#0EA5E9"/>
    <rect x="133" y="95" width="26" height="3" rx="1.5" fill="#94A3B8" opacity="0.6"/>

    <!-- Sub Card 2 -->
    <rect x="119" y="108" width="52" height="14" rx="4" fill="#15263A"/>
    <circle cx="126" cy="115" r="3" fill="#38BDF8"/>
    <rect x="133" y="113" width="22" height="3" rx="1.5" fill="#94A3B8" opacity="0.6"/>

    <!-- Bottom Nav Bar Indicator -->
    <rect x="135" y="138" width="20" height="2" rx="1" fill="#475569"/>
  </g>

  <!-- Floating Glass Widget 1: Cloud Sync (Top Left) -->
  <g filter="url(#shadowMobile)">
    <rect x="74" y="66" width="46" height="38" rx="10" fill="url(#glassBadgeGrad)" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.4"/>
    <!-- Cloud Icon -->
    <path d="M88 88 A4.5 4.5 0 0 1 93 84 A6.5 6.5 0 0 1 104 84 A5 5 0 0 1 108 88 L108 89 L88 89 Z" fill="#38BDF8"/>
    <circle cx="113" cy="68" r="3" fill="#00C6FF"/>
    <circle cx="113" cy="68" r="6" fill="#00C6FF" opacity="0.35"/>
  </g>

  <!-- Floating Glass Widget 2: Chart Analytics (Bottom Left) -->
  <g filter="url(#shadowMobile)">
    <rect x="42" y="100" width="44" height="36" rx="8" fill="url(#glassBadgeGrad)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.2"/>
    <!-- Mini Bar Chart -->
    <rect x="52" y="120" width="4" height="8" rx="1" fill="#0284C7"/>
    <rect x="59" y="114" width="4" height="14" rx="1" fill="#0EA5E9"/>
    <rect x="66" y="108" width="4" height="20" rx="1" fill="#00C6FF"/>
    <rect x="73" y="112" width="4" height="16" rx="1" fill="#38BDF8"/>
  </g>
</svg>
